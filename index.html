<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <!-- Font Awesome para sa mga icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* Para hindi mag-scroll ang video */
        }

        /* --- VIDEO BACKGROUND --- */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            object-fit: cover;
        }

        /* --- DARK OVERLAY PARA VISIBLE ANG TEXT --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75); /* 0.75 = 75% dark. Palitan mo kung gusto mo mas maliwanag o madilim */
            z-index: -1;
        }

        /* --- CARD DESIGN --- */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
        }

        .name {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .company {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* --- SOCIAL MEDIA ICONS (MAY KULAY) --- */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 28px;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-links a:hover {
            transform: translateY(-3px) scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Kulay ng mga totoong logo */
        .social-links a.fb { color: #1877F2; }
        .social-links a.ig { color: #E4405F; }
        .social-links a.li { color: #0A66C2; }
        .social-links a.map { color: #EA4335; }

        .footer {
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
        }
    </style>
</head>
<body>

    <!-- ILAGAY DITO ANG LINK NG VIDEO MO. Pwede itong MP4 file link o direct link sa isang video -->
    <video autoplay loop muted playsinline id="bg-video" poster="https://via.placeholder.com/1920x1080/1a1a2e/ffffff?text=Loading+Video...">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-background-2212-large.mp4" type="video/mp4">
        <!-- Ang video sa itaas ay sample lang. Palitan mo ng sarili mong video link. -->
    </video>
    
    <!-- Dark Overlay -->
    <div class="overlay"></div>

    <!-- Main Card -->
    <div class="card">
        <!-- PALITAN ANG PROFILE PICTURE LINK -->
        <img 
            src="https://via.placeholder.com/120" 
            alt="Profile Picture" 
            class="profile-pic"
        >

        <!-- PALITAN ANG MGA IMPORMASYON -->
        <h1 class="Name">Zidan</h1>
        <p class="title">Digital Business Card</p>
        <p class="company">NFC Card PH</p>
        
        <p class="bio">
            Save my contact info or call me directly.
        </p>

        <!-- Action Buttons -->
        <div class="buttons">
            <button class="btn btn-primary" id="saveContactBtn">
                <i class="fas fa-address-card"></i> Save Contact
            </button>

            <!-- PALITAN ANG NUMERO -->
            <a href="tel:+639762470762" class="btn btn-secondary">
                <i class="fas fa-phone-alt"></i> Call Now
            </a>

            <!-- PALITAN ANG WEBSITE LINK -->
            <a href="https://yourwebsite.com" target="_blank" class="btn btn-secondary">
                <i class="fas fa-globe"></i> Visit Website
            </a>
        </div>

        <!-- Social Links -->
        <div class="social-links">
            <!-- PALITAN ANG MGA LINK SA IBABA -->
            <a href="https://www.facebook.com/share/19fwESymQJ/" target="_blank" class="fb" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/yah_seethan?stkn=MWI5NGF5c3BjOTh4OQ==" target="_blank" class="ig" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <!-- BAGONG DAGDAG: GOOGLE MAPS LOGO -->
            <a href="https://maps.google.com/?q=Your+Business+Name" target="_blank" class="map" aria-label="Google Maps">
                <i class="fas fa-map-marker-alt"></i>
            </a>
        </div>

        <p class="footer">Powered by NFC Digital Card</p>
    </div>

    <script>
        // ============================================
        // vCard Generator — Save Contact Button
        // PALITAN ANG MGA IMPORMASYON SA IBABA
        // ============================================
        document.getElementById('saveContactBtn').addEventListener('click', function() {
            var contact = {
                firstName: "Zidan",
                lastName: "Nanali",
                phone: "+639762470762",
                email: "nathanielnanali123@email.com",
                company: "NFC Card",
                title: "Digital Business Card Specialist",
                website: "https://www.instagram.com/yah_seethan?stkn=MWI5NGF5c3BjOTh4OQ=="
            };

            var vcard = "BEGIN:VCARD\n";
            vcard += "VERSION:4.0\n";
            vcard += "FN:" + contact.firstName + " " + contact.lastName + "\n";
            vcard += "N:" + contact.lastName + ";" + contact.firstName + ";;;\n";
            vcard += "TEL;TYPE=work,voice:" + contact.phone + "\n";
            vcard += "EMAIL:" + contact.email + "\n";
            vcard += "ORG:" + contact.company + "\n";
            vcard += "TITLE:" + contact.title + "\n";
            vcard += "URL:" + contact.website + "\n";
            vcard += "END:VCARD";

            var blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.href = url;
            link.download = contact.firstName + "_" + contact.lastName + ".vcf";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });
    </script>

</body>
</html>
